workflows:
  lokles-ios:
    name: LOK LES IPA Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          cd LOKLES
          xcodegen generate

      - name: Build LOK LES
        script: |
          xcodebuild \
            -project LOKLES/LOKLES.xcodeproj \
            -scheme LOKLES \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create IPA
        script: |
          APP_PATH="build/Build/Products/Release-iphoneos/LOKLES.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "FEHLER: LOKLES.app wurde nicht gefunden!"
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/LOKLES.app

          cd Payload/..
          zip -r LOK-LES.ipa Payload

          unzip -l LOK-LES.ipa

    artifacts:
      - LOK-LES.ipa
      - /tmp/xcodebuild_logs/*.log
