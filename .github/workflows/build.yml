name: Build LOK LES IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd LOKLES
          xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild \
            -project LOKLES/LOKLES.xcodeproj \
            -scheme LOKLES \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R "build/Build/Products/Release-iphoneos/LOKLES.app" Payload/
          /usr/bin/zip -r LOK-LES.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LOK-LES-IPA
          path: LOK-LES.ipa
